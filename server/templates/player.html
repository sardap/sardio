<style>
    body {
        margin: 0;
        background: {{ background_colour }};
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
            'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
            sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }
    .play-button {
        display: block;
        margin: 0 auto;
        width: min(70vw, 400px);
        box-sizing: content-box;
        padding: 0.375rem;
        font: inherit;
        font-size: 1rem;
        color: {{ text_colour }};
        background: transparent;
        border: 5px solid {{ border_colour }};
        border-radius: 0.375rem;
        cursor: pointer;
        transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out;
    }
    .play-button:hover {
        color: #fff;
        background: {{ border_hover_colour }};
    }
    .play-button img {
        display: block;
        width: 100%;
        height: auto;
    }
    .play-info {
        width: min(70vw, 400px);
        margin: 0.5rem auto 0;
        color: {{ text_colour }};
        overflow-wrap: anywhere;
    }
</style>
<div class="player-body">
    <audio id="background-audio" data-src="/station/{{ station }}/play"
        hx-on:play="document.querySelector('.centered').classList.add('playing'); resetSleepTimer()"
        hx-on:pause="document.querySelector('.centered').classList.remove('playing'); resetSleepTimer()"
        hx-on:emptied="document.querySelector('.centered').classList.remove('playing'); resetSleepTimer()">
    </audio>
    <button type="button" class="play-button"
        hx-on:click="let a = document.getElementById('background-audio');
            if (a.paused) { a.src = a.dataset.src; a.play().catch(() => {}); }
            else { a.pause(); a.removeAttribute('src'); a.load(); }">
        <img src="/station/{{ station }}/image.png" alt="{{ station }}" />
    </button>
    <div class="play-info">
        <div class="play-label">
            <span class="when-playing"
                hx-get="/station/{{ station }}/now"
                hx-trigger="load, every 5s, click from:.play-button delay:100ms">PLAYING</span>
            <span class="when-paused">Not playing</span>
        </div>
    </div>
</div>
