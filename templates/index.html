<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>SARDIO</title>
        <style>
            body {
                margin: 0;
                background: #555555;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                    'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                    sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
            label {
                color: white;
            }
            .centered {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                text-align: center;
            }
            .station-picker {
                margin-bottom: 1rem;
            }
            .volume {
                margin-top: 1rem;
            }
            /* .playing is set on .centered by the audio element's play/pause events */
            .centered.playing .when-paused,
            .centered:not(.playing) .when-playing,
            .centered:not(.playing) .volume {
                display: none;
            }
            .play-button {
                padding: 0.375rem 0.75rem;
                font: inherit;
                font-size: 1rem;
                color: #dc3545;
                background: transparent;
                border: 1px solid #dc3545;
                border-radius: 0.375rem;
                cursor: pointer;
                transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out;
            }
            .play-button:hover {
                color: #fff;
                background: #dc3545;
            }
            .play-button:focus-visible {
                outline: 0;
                box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.5);
            }
            .play-button img {
                display: block;
                width: min(70vw, 400px);
                height: auto;
            }
        </style>
        <script src="/static/htmx.js"></script>
        <script>
            function setVolume(value) {
                let a = document.getElementById('background-audio');
                if (a) a.volume = value / 100;
            }
        </script>
    </head>
    <body>
        <div class="centered">
            <div class="station-picker">
                <label for="station-select">Station</label>
                <select id="station-select" name="station">
                    {% for station in stations %}
                    <option value="{{ station }}">{{ station }}</option>
                    {% endfor %}
                </select>
            </div>
            <!-- htmx events bubble, so the hooks below check event.target to
                 ignore requests from inside the player (like the /now poll). -->
            <div
                id="player"
                hx-get="/front/player"
                hx-include="#station-select"
                hx-trigger="load, change from:#station-select"
                hx-swap="innerHTML"
                hx-on:htmx:after:swap="if (event.target.id === 'player') setVolume(document.getElementById('volume').value)"
                hx-on:htmx:before:request="if (event.target.id !== 'player') return; let a = document.getElementById('background-audio'); if(a) { a.pause(); a.removeAttribute('src'); a.load(); }"
            ></div>
            <div class="volume">
                <input id="volume" type="range" min="0" max="100" value="100" hx-on:input="setVolume(event.target.value)" />
            </div>
        </div>
    </body>
</html>
