<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>SARDIO</title>
        <style>
            label {
                color: white;
            }
            .centered {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                text-align: center;
            }
            .station-picker {
                margin-bottom: 1rem;
            }
            .volume,
            .sleep {
                margin-top: 1rem;
            }
            .sleep input {
                width: 4rem;
            }
            /* .playing is set on .centered by the audio element's play/pause events */
            .centered.playing .when-paused,
            .centered:not(.playing) .when-playing,
            .centered:not(.playing) .volume,
            .centered:not(.playing) .sleep {
                display: none;
            }
        </style>
        <script src="/static/htmx.js"></script>
        <script>
            function setVolume(value) {
                let a = document.getElementById('background-audio');
                if (a) a.volume = value / 100;
            }
            let sleepTimer;
            function resetSleepTimer() {
                clearTimeout(sleepTimer);
                let a = document.getElementById('background-audio');
                let input = document.getElementById('sleep');
                // Stopping for any reason (pause, station change, timer firing) clears the timer.
                if (!a || a.paused) {
                    input.value = '';
                    return;
                }
                let mins = parseFloat(input.value);
                if (!(mins > 0)) return;
                sleepTimer = setTimeout(() => {
                    a.pause();
                    a.removeAttribute('src');
                    a.load();
                }, mins * 60 * 1000);
            }
        </script>
    </head>
    <body>
        <div class="centered">
            <div class="station-picker">
                <label for="station-select">Station</label>
                <select id="station-select" name="station">
                    {% for station in stations %}
                    <option value="{{ station }}">{{ station }}</option>
                    {% endfor %}
                </select>
            </div>
            <div
                id="player"
                hx-get="/front/player"
                hx-include="#station-select"
                hx-trigger="load, change from:#station-select"
                hx-swap="innerHTML"
                hx-on:htmx:after:swap="if (event.target.id === 'player') setVolume(document.getElementById('volume').value)"
                hx-on:htmx:before:request="if (event.target.id !== 'player') return; let a = document.getElementById('background-audio'); if(a) { a.pause(); a.removeAttribute('src'); a.load(); }"
            ></div>
            <div class="volume">
                <input id="volume" type="range" min="0" max="100" value="100" hx-on:input="setVolume(event.target.value)" />
            </div>
            <div class="sleep">
                <label for="sleep">Sleep (mins)</label>
                <input id="sleep" type="number" autocomplete="off" min="0" step="1" placeholder="off" hx-on:input="resetSleepTimer()" />
            </div>
        </div>
    </body>
</html>
